<!doctype html>
<html lang="en">
  <head>
    <link
      rel="preload"
      href="./assets/fonts/InterVariable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./assets/fonts/InterVariable-Italic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./assets/fonts/Urbanist-VariableFont_wght.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./assets/fonts/Urbanist-Italic-VariableFont_wght.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battleship</title>
  </head>
  <body>
    <h1>Battleship</h1>
    <p class="instruction">Choose the position of your ships!</p>
    <div class="ui-buttons">
      <button class="randomise ui-button" type="button">Randomise</button>
      <button class="start ui-button" type="button">Start Game</button>
    </div>
    <div class="gameboards">
      <div class="human gameboard-wrapper">
        <h2 class="human-title">Human</h2>
        <div id="human-gameboard"></div>
      </div>
      <div class="computer gameboard-wrapper inactive">
        <h2 class="computer-title">Computer</h2>
        <div id="computer-gameboard"></div>
      </div>
    </div>
  </body>
</html>
